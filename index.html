<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicrocoft 软件资源站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"微软雅黑",sans-serif;background:#f4f5f7;}
        header{background:#111;color:#fff;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;}
        .logo{font-size:26px;font-weight:bold;letter-spacing:2px;}
        .login-btn{padding:8px 18px;background:#0066ff;border:none;border-radius:4px;color:#fff;cursor:pointer;}
        .container{max-width:1100px;margin:40px auto;padding:0 20px;}
        .cate{margin-bottom:40px;}
        .cate-title{font-size:20px;border-left:5px solid #0066ff;padding-left:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;}
        .soft-card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 4px #ddd;margin-bottom:20px;position:relative;}
        .soft-img{width:180px;height:120px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid #eee;transition:0.3s;}
        .soft-img:hover{border-color:#fb7299;transform:scale(1.02);}
        .soft-name{font-size:18px;font-weight:bold;margin:10px 0 5px;}
        .soft-desc{color:#666;line-height:1.6;margin-bottom:10px;}
        .down-btn{background:#22c55e;color:#fff;border:none;padding:7px 16px;border-radius:4px;cursor:pointer;}
        .del-soft{background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;margin-left:10px;}
        .del-cate{background:#dc3545;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;}

        /* 登录弹窗 */
        .mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:999;}
        .login-box{background:#fff;padding:30px;border-radius:8px;width:320px;}
        .close{text-align:right;cursor:pointer;font-size:18px;}
        .login-box h3{margin-bottom:20px;text-align:center;}
        .login-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px;}
        .login-box button{width:100%;padding:10px;background:#0066ff;color:#fff;border:none;border-radius:4px;margin-top:10px;cursor:pointer;}

        /* 管理后台 */
        .admin-panel{display:none;background:#fff;padding:25px;border-radius:8px;margin:30px 0;}
        .admin-panel input{display:block;width:100%;max-width:400px;padding:9px;margin:8px 0;border:1px solid #ccc;border-radius:4px;}
        .add-btn{padding:9px 20px;background:#0066ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:10px;}
    </style>
</head>
<body>
<header>
    <div class="logo">Nicrocoft</div>
    <button class="login-btn" onclick="openLogin()">管理员登录</button>
</header>

<div class="container">
    <div id="listBox"></div>
    <div class="admin-panel" id="adminPanel">
        <h3>管理员新增软件</h3>
        <input type="text" id="cateName" placeholder="分类名称 例如：系统工具">
        <input type="text" id="softName" placeholder="软件名称">
        <input type="text" id="softDesc" placeholder="软件简介">
        <input type="text" id="imgUrl" placeholder="软件图片链接">
        <input type="text" id="bilibiliUrl" placeholder="B站测评网址">
        <input type="text" id="downUrl" placeholder="123网盘下载链接">
        <button class="add-btn" onclick="addSoft()">添加软件</button>
    </div>
</div>

<!-- 登录弹窗 -->
<div class="mask" id="mask">
    <div class="login-box">
        <div class="close" onclick="closeLogin()">✕</div>
        <h3>管理员登录</h3>
        <input type="text" id="usr" placeholder="账号">
        <input type="password" id="pwd" placeholder="密码">
        <button onclick="login()">登录</button>
    </div>
</div>

<script>
const adminAcc = "admin";
const adminPwd = "123456";
let isLogin = false;
let data = JSON.parse(localStorage.getItem('nicroSoftData')) || [];

// 渲染页面
function render(){
    let html = "";
    data.forEach((cate, cIdx)=>{
        html += `<div class="cate">
                    <div class="cate-title">
                        ${cate.name}
                        ${isLogin ? `<button class="del-cate" onclick="delCate(${cIdx})">删除分类</button>` : ''}
                    </div>`;
        cate.list.forEach((item, sIdx)=>{
            html += `
            <div class="soft-card">
                <img class="soft-img" src="${item.img}" alt="软件图片" onclick="goBilibili('${item.bilibili}')">
                <div class="soft-name">${item.name} 
                    ${isLogin ? `<button class="del-soft" onclick="delSoft(${cIdx},${sIdx})">移除</button>` : ''}
                </div>
                <div class="soft-desc">${item.desc}</div>
                <button class="down-btn" onclick="goDownload('${item.down}')">立即下载</button>
            </div>
            `;
        });
        html += `</div>`;
    });
    document.getElementById("listBox").innerHTML = html;
}

// 点击图片跳转B站
function goBilibili(url){
    window.open(url,"_blank");
}

// 下载文件
function goDownload(url){
    let a = document.createElement("a");
    a.href = url;
    a.click();
}

// 删除单个软件
function delSoft(cateIdx, softIdx){
    if(!confirm("确定要移除这个软件吗？")) return;
    data[cateIdx].list.splice(softIdx,1);
    localStorage.setItem('nicroSoftData',JSON.stringify(data));
    render();
}

// 删除整个分类
function delCate(cateIdx){
    if(!confirm("确定要删除整个分类及所有软件吗？")) return;
    data.splice(cateIdx,1);
    localStorage.setItem('nicroSoftData',JSON.stringify(data));
    render();
}

// 登录弹窗
function openLogin(){document.getElementById("mask").style.display="flex";}
function closeLogin(){document.getElementById("mask").style.display="none";}

// 管理员登录
function login(){
    let u = document.getElementById("usr").value;
    let p = document.getElementById("pwd").value;
    if(u===adminAcc&&p===adminPwd){
        isLogin=true;
        closeLogin();
        document.getElementById("adminPanel").style.display="block";
        render();
        alert("登录成功，显示管理操作按钮");
    }else{
        alert("账号或密码错误");
    }
}

// 添加软件
function addSoft(){
    let cName = document.getElementById("cateName").value.trim();
    let sName = document.getElementById("softName").value.trim();
    let sDesc = document.getElementById("softDesc").value.trim();
    let imgUrl = document.getElementById("imgUrl").value.trim();
    let bUrl = document.getElementById("bilibiliUrl").value.trim();
    let dUrl = document.getElementById("downUrl").value.trim();

    if(!cName||!sName||!sDesc||!imgUrl||!bUrl||!dUrl){
        alert("所有栏目都要填完整！");
        return;
    }

    let cate = data.find(x=>x.name===cName);
    if(!cate){
        data.push({name:cName,list:[]});
        cate = data[data.length-1];
    }

    cate.list.push({
        name:sName,
        desc:sDesc,
        img:imgUrl,
        bilibili:bUrl,
        down:dUrl
    });

    localStorage.setItem('nicroSoftData',JSON.stringify(data));
    render();
    document.querySelectorAll(".admin-panel input").forEach(el=>el.value="");
    alert("软件添加成功！");
}

// 初始化
render();
</script>
</body>
</html>
